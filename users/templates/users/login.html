{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinanceDaily | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Base styles -->
    <link rel="icon" href="{% static 'images/favicon.png' %}">

        <!-- Icons & Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'style/variables.css' %}">
    <link rel="stylesheet" href="{% static 'users/style/login.css' %}">
</head>
<body>

<main class="auth-page">

    <!-- Centered authentication card -->
    <section class="auth-card" role="region" aria-labelledby="login-title">

        <!-- Brand -->
        <div class="auth-brand">
            <img src="{% static 'images/logo.png' %}" alt="FinanceDaily logo">
        </div>

        <!-- Title -->
        <header class="auth-header">
            <h1 id="login-title">Sign in to FinanceDaily</h1>
            <p class="auth-subtitle">
                Manage your finances with clarity and control.
            </p>
        </header>

        <!-- Messages -->
        {% if messages %}
        <div class="auth-messages" role="alert">
            {% for message in messages %}
                <p class="message {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Login form -->
        <form method="post" class="auth-form" novalidate>
            {% csrf_token %}

            <div class="form-field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Sign In
            </button>
        </form>

        <!-- Secondary action -->
        <div class="auth-footer">
            <p>
                Don’t have an account?
                <a href="{% url 'signup' %}">Create one</a>
            </p>
        </div>

    </section>

</main>

</body>
</html>
