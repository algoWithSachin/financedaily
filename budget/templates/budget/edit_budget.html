{% extends "base.html" %}
{% load static %}

{% block title %}Edit Budget - {{ budget.name }} | FinanceDaily{% endblock %}
{% block style %}
<link rel="stylesheet" href="{% static 'record/style/add_record.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="mx-auto" style="max-width: 520px;">
    <h2 class="text-center fw-semibold mb-4">Edit Budget</h2>

    <form method="POST" class="p-4 bg-white rounded shadow-sm">
      {% csrf_token %}

      <div class="mb-3">
        <label for="name" class="form-label fw-semibold">Budget Name</label>
        <input type="text" id="name" name="name" value="{{ budget.name }}" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="amount" class="form-label fw-semibold">Amount (₹)</label>
        <input type="number" id="amount" name="amount" value="{{ budget.amount }}" class="form-control" required>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="start_date" class="form-label fw-semibold">Start Date</label>
          <input type="date" id="start_date" name="start_date" value="{{ budget.start_date|date:'Y-m-d' }}" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label for="end_date" class="form-label fw-semibold">End Date</label>
          <input type="date" id="end_date" name="end_date" value="{{ budget.end_date|date:'Y-m-d' }}" class="form-control" required>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-warning">Save Changes</button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
