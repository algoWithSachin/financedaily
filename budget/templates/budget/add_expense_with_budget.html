{% extends "base.html" %}
{% load static %}

{% block title %}Fintrack | Add Expense{% endblock %}

{% block style %}
<link rel="stylesheet" href="{% static 'record/style/add_record.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="text-center mb-4">
    <h2 class="fw-semibold">Add Expense to '{{ budget_name }}'</h2>
  </div>

  <form action="{% url 'add_expense_with_budget' budget.id %}" method="POST" class="p-4 bg-white rounded shadow-sm">
    {% csrf_token %}

    {% if budget %}
        <input type="hidden" name="budget" value="{{ budget.id }}">
    {% endif %}

    <!-- AMOUNT (PRIMARY) -->
    <div class="mb-3">
      <label for="amount" class="form-label fw-semibold">Amount</label>
      <input type="number"
             id="amount"
             name="amount"
             class="form-control"
             step="0.01"
             required
             autofocus>
    </div>

    <!-- CATEGORY -->
    <div class="mb-3">
      <label for="category" class="form-label fw-semibold">Category</label>
        <select id="category" name="category" class="form-select" required>
        <option value="" disabled selected>Choose category</option>

        <optgroup label="Expense">
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="entertainment">Entertainment</option>
            <option value="bills">Bills</option>
            <option value="shopping">Shopping</option>
        </optgroup>

        <option value="other">Other</option>
        </select>
    </div>

    <!-- TYPE + DATE (SECONDARY) -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label fw-semibold">Type</label>
        <select class="form-select" disabled>
          <option selected>Expense</option>
        </select>
        <input type="hidden" name="type" value="Expense">
      </div>

      <div class="col-md-6 mb-3">
        <label for="date" class="form-label fw-semibold">Date</label>
        <input type="date"
               id="date"
               name="date"
               class="form-control"
               value="{{ today|default:'' }}">
      </div>
    </div>

    <!-- ADD NOTE TOGGLE -->
    <button type="button"
            id="toggleNote"
            class="btn btn-sm btn-link p-0 mb-2">
      + Add note
    </button>

    <!-- DESCRIPTION (HIDDEN) -->
    <div class="mb-3 d-none" id="noteField">
      <label for="description" class="form-label fw-semibold">
        Description
      </label>
      <textarea id="description"
                name="description"
                class="form-control"
                rows="3"></textarea>
    </div>

    <!-- ACTIONS -->
    <div class="d-flex justify-content-end gap-2 mt-3">
      <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">
        Cancel
      </a>
      <button type="submit" class="btn btn-primary">
        Add Expense
      </button>
    </div>
  </form>
</div>

<script>
    // Add Note toggle
    const toggleBtn = document.getElementById("toggleNote");
    const noteField = document.getElementById("noteField");

    toggleBtn.addEventListener("click", () => {
        noteField.classList.toggle("d-none");
        toggleBtn.textContent = noteField.classList.contains("d-none")
        ? "+ Add note"
        : "Hide note";
    });
</script>

{% endblock %}
