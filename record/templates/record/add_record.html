{% extends "base.html" %}
{% load static %}

{% block title %}Add Record | FinanceDaily{% endblock  %}
{% block style %} 
<link rel="stylesheet" href="{% static 'style/variables.css' %}">
<link rel="stylesheet" href="{% static "record/style/add_record.css" %}">{% endblock  %}
{% block content %}


<div class="container mt-5">
  <div class="text-center mb-4">
    <h2 class="fw-semibold">Add Transaction</h2>
  </div>

  <form action="{% url 'add_record' %}" method="POST"
        class="p-4 bg-white rounded shadow-sm">
    {% csrf_token %}

    <!-- AMOUNT (PRIMARY) -->
    <div class="mb-3">
      <label for="amount" class="form-label fw-semibold">Amount</label>
      <input type="number"
             id="amount"
             name="amount"
             class="form-control"
             step="0.01"
             required
             autofocus>
    </div>

    <!-- CATEGORY -->
    <div class="mb-3">
      <label for="category" class="form-label fw-semibold">Category</label>
        <select id="category" name="category" class="form-select" required>
        <option value="" disabled selected>Choose category</option>

        <optgroup label="Expense">
            <option value="food" data-type="Expense">Food</option>
            <option value="transport" data-type="Expense">Transport</option>
            <option value="entertainment" data-type="Expense">Entertainment</option>
            <option value="bills" data-type="Expense">Bills</option>
            <option value="shopping" data-type="Expense">Shopping</option>
        </optgroup>

        <optgroup label="Income">
            <option value="salary" data-type="Income">Salary</option>
            <option value="freelance" data-type="Income">Freelance</option>
            <option value="investments" data-type="Income">Investments</option>
            <option value="bonus" data-type="Income">Bonus</option>
            <option value="gifts" data-type="Income">Gifts</option>
        </optgroup>

        <option value="other">Other</option>
        </select>
    </div>

    <!-- TYPE + DATE (SECONDARY) -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="type" class="form-label fw-semibold">Type</label>
        <select id="type" name="type" class="form-select" required>
          <option value="Expense" selected>Expense</option>
          <option value="Income">Income</option>
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label for="date" class="form-label fw-semibold">Date</label>
        <input type="date"
               id="date"
               name="date"
               class="form-control"
               value="{{ today|default:'' }}">
      </div>
    </div>

    <!-- ADD NOTE TOGGLE -->
    <button type="button"
            id="toggleNote"
            class="btn btn-sm btn-link p-0 mb-2">
      + Add note
    </button>

    <!-- DESCRIPTION (HIDDEN) -->
    <div class="mb-3 d-none" id="noteField">
      <label for="description" class="form-label fw-semibold">
        Description
      </label>
      <textarea id="description"
                name="description"
                class="form-control"
                rows="3"></textarea>
    </div>

    <!-- ACTIONS -->
    <div class="d-flex justify-content-end gap-2 mt-3">
      <a href="{% url 'record_list' %}"
         class="btn btn-outline-secondary">
        Cancel
      </a>

      <button type="submit" class="btn btn-primary">
        Add
      </button>
    </div>
  </form>
</div>
<script>
    const categorySelect = document.getElementById("category");
    const typeSelect = document.getElementById("type");

    let userManuallyChangedType = false;

    // Detect manual type change
    typeSelect.addEventListener("change", () => {
        userManuallyChangedType = true;
    });

    categorySelect.addEventListener("change", () => {
        const selectedOption =
        categorySelect.options[categorySelect.selectedIndex];

        const inferredType = selectedOption.dataset.type;

        // Do nothing for "Other" or if user already chose type manually
        if (!inferredType || userManuallyChangedType) return;

        typeSelect.value = inferredType;
    });


  const toggleBtn = document.getElementById("toggleNote");
  const noteField = document.getElementById("noteField");

  toggleBtn.addEventListener("click", () => {
    noteField.classList.toggle("d-none");
    toggleBtn.textContent = noteField.classList.contains("d-none")
      ? "+ Add note"
      : "Hide note";
  });
</script>


{% endblock  %}
